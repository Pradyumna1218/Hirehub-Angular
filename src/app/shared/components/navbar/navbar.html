<nav class="navbar">
  <a routerLink="/" class="brand">Hirehub</a>

  <div class="nav-links">
    <a routerLink="/jobs">Browse Jobs</a>

    @if (authService.isLoggedIn()) {
      @if (authService.currentUser()?.role === 'Client') {
        <a routerLink="/jobs/new">Post a Job</a>
        <a routerLink="/my-jobs">My Jobs</a>
      }
      @if (authService.currentUser()?.role === 'Freelancer') {
        <a routerLink="/my-proposals">My Proposals</a>
      }
      <a routerLink="/my-orders">My Orders</a>
      <span class="welcome">Hi, {{ authService.currentUser()?.fullName }}</span>
      <button (click)="authService.logout()">Log Out</button>
    } @else {
      <a routerLink="/login">Log In</a>
      <a routerLink="/register">Sign Up</a>
    }
  </div>
</nav>
