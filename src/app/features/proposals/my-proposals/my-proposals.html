<div class="container py-5">
  <h1 class="mb-4 fw-bold">My Proposals</h1>

  @if (isLoading()) {
    <p class="text-secondary">Loading...</p>
  } @else if (proposals().length === 0) {
    <p class="text-secondary">You haven't submitted any proposals yet.</p>
  } @else {
    <div class="row g-4">
      @for (p of proposals(); track p.id) {
        <div class="col-md-6 col-lg-4">
          <a [routerLink]="['/jobs', p.jobId]" class="card h-100 text-decoration-none text-reset p-3">
            <h5 class="fw-semibold">{{ p.jobTitle }}</h5>
            <p class="text-secondary small mb-3">Your bid: ${{ p.proposedPrice }} • {{ p.deliveryDays }} days</p>
            <span class="badge mt-auto align-self-start"
                  [class.text-bg-warning]="p.status === 'Pending'"
                  [class.text-bg-success]="p.status === 'Accepted'"
                  [class.text-bg-danger]="p.status === 'Rejected'">
              {{ p.status }}
            </span>
          </a>
        </div>
      }
    </div>
  }
</div>
