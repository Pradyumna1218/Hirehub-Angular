<div class="container py-5 d-flex justify-content-center">
  <div class="card p-4 p-md-5" style="max-width: 600px; width: 100%;">
    <h1 class="fw-bold mb-4">Post a New Job</h1>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" class="form-control" name="title" [(ngModel)]="formData.title" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" [(ngModel)]="formData.description" required rows="5"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Category</label>
        <select class="form-select" name="categoryId" [(ngModel)]="formData.categoryId" required>
          @for (cat of categories(); track cat.id) {
            <option [value]="cat.id">{{ cat.name }}</option>
          }
        </select>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label">Budget ($)</label>
          <input type="number" class="form-control" name="budget" [(ngModel)]="formData.budget" required min="1" />
        </div>
        <div class="col-6">
          <label class="form-label">Deadline</label>
          <input type="date" class="form-control" name="deadline" [(ngModel)]="formData.deadline" required />
        </div>
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading()">
        {{ isLoading() ? 'Posting...' : 'Post Job' }}
      </button>
    </form>
  </div>
</div>
