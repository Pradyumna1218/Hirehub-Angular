<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card p-4 p-md-5" style="max-width: 420px; width: 100%;">
    <h1 class="fw-bold mb-4 text-center">Welcome Back</h1>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="formData.email" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="formData.password" required />
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading()">
        {{ isLoading() ? 'Logging in...' : 'Log In' }}
      </button>
    </form>

    <p class="text-center text-secondary mt-3 mb-0">
      Don't have an account? <a routerLink="/register">Sign up</a>
    </p>
  </div>
</div>
